<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>貓咪辦公室(分區版)</title>
<style>
:root{color-scheme:dark;--bg:#15122a;--bg2:#1d1838;--card:#241e42;--line:#3d3563;--fg:#f4eefc;--dim:#b7afd3;--acc:#ff9f6e;
--font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;--r:14px}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--font)}
body{display:grid;height:100vh;height:100dvh;grid-template-columns:minmax(0,1fr) 300px;grid-template-rows:auto minmax(0,1fr);
 grid-template-areas:"top top" "stage panel";gap:8px 12px;padding:8px 12px 12px;
 background:radial-gradient(1200px 700px at 30% 0,#241d45 0,transparent 70%),var(--bg)}
body.nopanel{grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "stage"}
body.nopanel #panel{display:none}
/* 頂列 */
.top{grid-area:top;display:flex;align-items:center;gap:12px;min-width:0;min-height:40px}
h1{font-size:18px;margin:0;font-weight:700;white-space:nowrap;letter-spacing:.02em}
h1 small{font-weight:400;color:var(--dim);font-size:12px}
#conn{margin:0;font-size:12px;color:var(--dim);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:7px}
#conn::before{content:"";width:8px;height:8px;border-radius:50%;background:#6f6896;flex:none}
#conn.ok::before{background:#7ee0b0}#conn.bad::before{background:#ff7587}
.sp{flex:1}
.top button,.top a{all:unset;box-sizing:border-box;cursor:pointer;min-height:40px;display:inline-flex;align-items:center;gap:6px;padding:0 14px;border-radius:12px;
 font:600 13px var(--font);color:var(--fg);background:#ffffff0f;border:1px solid var(--line);white-space:nowrap}
.top a{color:var(--acc)}
.top button:hover,.top a:hover{background:#ffffff1c}
.top button:focus-visible,.top a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#nBadge{font-weight:700;color:var(--acc)}
.hs{font-weight:400;color:var(--dim)}
/* 房間舞台:填滿剩餘空間,內容依全景縮放置中 */
#stage{grid-area:stage;position:relative;min-width:0;min-height:0;line-height:0;overflow:hidden;touch-action:none}
canvas{position:absolute;inset:0;display:block;width:100%;height:100%;cursor:default;-webkit-user-select:none;user-select:none}
#stage.pan canvas{cursor:grab}#stage.drag canvas{cursor:grabbing}
#stage:focus-visible{outline:3px solid var(--acc);outline-offset:-3px}
.lab{position:absolute;left:0;top:0;font-size:10px;line-height:1.25;white-space:nowrap;pointer-events:none;
 color:#6b4a3d;background:#fff8ece6;padding:0 6px;border-radius:10px;box-shadow:0 1px 0 #c9a58f,0 2px 6px #0003;will-change:transform}
.lab.ses{box-shadow:0 0 0 1.5px #7fb59d inset,0 2px 6px #0003;color:#2d6f60}
.lab.sel{background:#fff;color:#3d2a22;box-shadow:0 0 0 2px #ff7f4a,0 2px 8px #0004}
#stage.nolab .lab:not(.sel){display:none}
.ub{position:absolute;left:0;top:0;z-index:2;pointer-events:none;font-size:10px;font-weight:700;line-height:1.25;white-space:nowrap;color:#fff;background:#ff6b82;
 border:1.5px solid #fff;padding:0 5px;border-radius:10px;box-shadow:0 2px 5px #0005;will-change:transform}
.ubr{flex:none;font-style:normal;font-size:11px;font-weight:700;color:#fff;background:#ff6b82;border-radius:10px;padding:0 6px;line-height:16px;white-space:nowrap}
.ubr[hidden]{display:none}
@media(prefers-reduced-motion:no-preference){.ub,.ubr{animation:ubp 2.2s ease-in-out infinite}}
@keyframes ubp{50%{box-shadow:0 0 0 4px #ff6b8255,0 2px 5px #0005}}
#tip{position:absolute;left:0;top:0;z-index:5;pointer-events:none;display:none;background:#fff8ec;color:#4a342c;font-size:13px;line-height:1.35;
 padding:6px 11px;border-radius:12px;border:2px solid #6e4b3d;box-shadow:0 4px 14px #0006;white-space:nowrap;transform:translate(-50%,-100%)}
#tip b{display:block;font-size:12px;color:#a0614a}
#tip em{display:block;font-style:normal;font-size:12px;color:#7a5a4c;max-width:min(300px,80vw);overflow:hidden;text-overflow:ellipsis}
#ctl{position:absolute;right:10px;bottom:10px;z-index:6;display:flex;gap:6px;line-height:1}
#ctl button{all:unset;box-sizing:border-box;cursor:pointer;min-width:40px;height:40px;padding:0 12px;display:flex;align-items:center;justify-content:center;
 font:600 14px var(--font);color:#4a342c;background:#fff8eceb;border:2px solid #6e4b3d;border-radius:12px;box-shadow:0 3px 10px #0005}
#ctl button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#ctl button:active{transform:translateY(1px)}
#hint{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);z-index:6;pointer-events:none;background:#2a2248d9;color:#f1ebff;font-size:12px;line-height:1.3;
 padding:6px 12px;border-radius:14px;transition:opacity .6s;white-space:nowrap}
/* 名單面板(桌機:右側;手機:底部抽屜) */
#panel{grid-area:panel;min-height:0;display:flex;flex-direction:column;background:var(--bg2);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:12px 16px 2px}
.ph h2{margin:0;font-size:15px;font-weight:700}
#cnt{font-size:12px;color:var(--dim)}
.pt{margin:0;padding:0 16px 6px;font-size:11px;color:var(--dim)}
#roster{list-style:none;margin:0;padding:2px 8px 8px;overflow:auto;flex:1;min-height:0;display:flex;flex-direction:column;gap:2px;overscroll-behavior:contain}
#roster button{all:unset;box-sizing:border-box;display:flex;gap:10px;align-items:center;width:100%;cursor:pointer;border-radius:12px;padding:6px 8px;min-height:48px}
#roster button:hover{background:#ffffff0d}
#roster button:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
#roster button[aria-pressed=true]{background:#ff9f6e1c;box-shadow:inset 0 0 0 1.5px var(--acc)}
.av{position:relative;flex:none;width:30px;height:27px;margin-top:5px;border-radius:50% 50% 46% 46%;border:2px solid #00000040;
 background:radial-gradient(circle at 31% 56%,#3b2a2e 0 2px,#0000 2.6px),radial-gradient(circle at 69% 56%,#3b2a2e 0 2px,#0000 2.6px),var(--c)}
.av::before,.av::after{content:"";position:absolute;top:-8px;width:12px;height:11px;background:var(--c);clip-path:polygon(50% 0,100% 100%,0 100%)}
.av::before{left:-1px;transform:rotate(-8deg)}.av::after{right:-1px;transform:rotate(8deg)}
.tx{display:block;min-width:0;flex:1}
.tx strong{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .st{display:block;font-size:12px;color:var(--dim)}
.tx .dt{display:block;font-size:11px;color:#938bb3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sd{flex:none;width:9px;height:9px;border-radius:50%;background:#6f6896}
button[data-m=work] .sd,button[data-m=busy] .sd,button[data-m=done] .sd{background:#7ee0b0}
button[data-m=think] .sd{background:#c4b2ff}button[data-m=wait] .sd{background:#ffd98a}
button[data-m=error] .sd{background:#ff7587}button[data-m=rotate] .sd{background:#8cc7e8}
#roster li.empty{color:var(--dim);font-size:13px;padding:8px 10px}
.credit{margin:0;padding:8px 16px 12px;font-size:11px;color:#8f87ae;border-top:1px solid var(--line)}
@media(max-width:859px){
 body{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"top" "stage" "panel";gap:6px;padding:6px 8px calc(8px + env(safe-area-inset-bottom))}
 body.nopanel{grid-template-areas:"top" "stage"}
 .top{gap:8px}.top button,.top a{padding:0 11px}
 h1{font-size:16px}.hs,#mode{display:none}
 #panel{height:36vh;height:36dvh;border-radius:20px 20px 14px 14px}
 #panel::before{content:"";align-self:center;width:38px;height:4px;border-radius:2px;background:#4d4577;margin:7px 0 0;flex:none}
 .ph{padding-top:6px}
 #roster{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 6px;align-content:start}
 .pt,.credit{display:none}
 #ctl button{min-width:44px;height:44px}
 .lab{font-size:9px;padding:0 4px}
}
@media(prefers-reduced-motion:reduce){#hint{transition:none}}
/* 發任務列 + 對話檢視(UI 層) */
.send{margin:0;padding:4px 12px 8px;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--line)}
.send input,.send select,.cf input{font:13px var(--font);color:var(--fg);background:#ffffff0f;border:1px solid var(--line);border-radius:12px;min-height:40px;padding:0 12px;min-width:0}
.send input::placeholder,.cf input::placeholder{color:#9189b4}
.send input:focus-visible,.send select:focus-visible,.cf input:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.send select option{background:var(--bg2);color:var(--fg)}
.sr{display:flex;gap:6px}.sr select{flex:1}
.go{all:unset;box-sizing:border-box;cursor:pointer;min-height:40px;padding:0 14px;border-radius:12px;font:700 13px var(--font);color:#4a2a1c;background:linear-gradient(#ffc7a3,#ffa877);
 box-shadow:0 2px 0 #c9774a;display:inline-flex;align-items:center;white-space:nowrap}
.go:hover{filter:brightness(1.06)}.go:active{transform:translateY(1px);box-shadow:0 1px 0 #c9774a}
.go:focus-visible{outline:2px solid #fff;outline-offset:2px}.go[disabled]{opacity:.5;cursor:default}
.sm{margin:0;min-height:0;font-size:11px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sm:empty{display:none}.sm.bad{color:#ff9aa8}
#chat{position:absolute;z-index:8;left:10px;top:10px;bottom:10px;width:min(410px,calc(100% - 20px));display:flex;flex-direction:column;line-height:1.45;touch-action:auto;
 background:#211b3ef2;border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 28px #0007;overflow:hidden;backdrop-filter:blur(6px)}
#chat[hidden]{display:none}
.ch{display:flex;align-items:center;gap:8px;padding:10px 10px 6px 14px}
.ch h3{margin:0;font-size:15px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{font-size:11px;padding:2px 9px;border-radius:10px;background:#ffffff14;color:var(--dim);white-space:nowrap}
.chip.work{background:#7ee0b030;color:#9ff0c8}.chip.think{background:#c4b2ff30;color:#d8ccff}.chip.error{background:#ff758730;color:#ffa3b0}.chip.wait{background:#ffd98a30;color:#ffe3a6}
.x{all:unset;box-sizing:border-box;cursor:pointer;width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:12px;font-size:16px;color:var(--fg)}
.x:hover{background:#ffffff1c}.x:focus-visible{outline:2px solid var(--acc)}
.tsel{margin:0 12px 6px;display:flex;gap:6px}
.tsel select{flex:1;min-width:0;font:12px var(--font);color:var(--fg);background:#ffffff0f;border:1px solid var(--line);border-radius:10px;min-height:36px;padding:0 8px}
.tsel select option{background:var(--bg2);color:var(--fg)}
.tsel select:focus-visible{outline:2px solid var(--acc)}
.tsel .go{min-height:36px;padding:0 10px;font-size:12px;color:#5a1f2a;background:linear-gradient(#ffd1d8,#ff9fae);box-shadow:0 2px 0 #c96d7c}
.tsel .go[hidden]{display:none}
#msgs{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:6px 12px 10px;display:flex;flex-direction:column;gap:7px;border-top:1px solid var(--line)}
.m{max-width:92%;padding:7px 11px;border-radius:14px;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word}
.m small{display:block;font-size:10px;opacity:.65;margin-bottom:2px}
.m.u{align-self:flex-end;background:#ffd9c2;color:#4a342c;border-bottom-right-radius:4px}
.m.b{align-self:flex-start;background:#e6dcff;color:#2a2140;border-bottom-left-radius:4px}
.m.r{align-self:stretch;max-width:100%;background:#fff3c9;color:#4a3b14;border-radius:12px}
.m.e{align-self:stretch;max-width:100%;background:#ffc9d1;color:#5a1f2a;border-radius:12px}
.tc{align-self:flex-start;max-width:96%;font-size:11px;padding:3px 9px;border-radius:10px;background:#c9eedd;color:#1f5a45;overflow-wrap:anywhere;white-space:pre-wrap}
.tc.rs{background:#ffffff12;color:var(--dim)}.tc.bad{background:#ffc9d1;color:#5a1f2a}
.note{align-self:center;font-size:11px;color:var(--dim);text-align:center;overflow-wrap:anywhere;max-width:96%}
.stat{align-self:stretch;font-size:11px;color:#a9a1c8;text-align:center}
.dots{align-self:flex-start;color:var(--dim);font-size:12px}
.dots::after{content:"…";animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
.cf{margin:0;display:flex;gap:6px;padding:8px 10px 10px;border-top:1px solid var(--line)}
.cf input{flex:1}
@media(prefers-reduced-motion:reduce){.dots::after{animation:none}}
@media(max-width:859px){
 body.chatopen{grid-template-areas:"top" "stage";grid-template-rows:auto minmax(0,1fr)}
 body.chatopen #panel{display:none}
 #chat{left:6px;right:6px;top:6px;bottom:6px;width:auto}
 .send{padding:2px 10px 6px}
 .send input{min-height:44px}.sr select,.go{min-height:44px}
 #panel{height:44dvh}
}
body.sheet #chat{display:none}
/* ?sheet=1 對照表:恢復一般捲動 */
body.sheet{display:block;height:auto;overflow:auto;padding:0}html:has(body.sheet){overflow:auto;height:auto}
body.sheet .top,body.sheet #panel,body.sheet #ctl,body.sheet #hint{display:none}
body.sheet #stage{border-radius:0;border:0;box-shadow:none;height:auto}
body.sheet canvas{position:static;width:100%;height:auto}
</style>
</head>
<body>
<header class="top">
  <h1>貓咪辦公室 <small id="mode"></small></h1>
  <p id="conn" role="status">連線中…</p>
  <div class="sp"></div>
  <button type="button" id="bPanel" aria-expanded="true" aria-controls="panel">名單 <span id="nBadge">0</span></button>
</header>
<div id="stage">
  <canvas id="cv" role="img" aria-label="手繪風大房間:書櫃閱讀角、紙箱角、低矮小桌、軟墊、客廳沙發、廚房食碗、貓跳台、貓窩與浴室貓砂盆之間,圓滾滾的貓咪依 Bot 與互動 session 的即時狀態在各角落工作或休息;名單列出各貓咪狀態"></canvas>
  <div id="tip" role="status"></div>
  <div id="ctl"><button type="button" id="bMode" aria-pressed="false">放大</button><button type="button" id="bIn" aria-label="放大畫面">+</button><button type="button" id="bOut" aria-label="縮小畫面">−</button></div>
  <div id="hint" aria-hidden="true">拖曳移動・雙指縮放</div>
  <section id="chat" hidden aria-label="貓咪對話">
    <div class="ch"><h3 id="chT"></h3><span class="chip" id="chS"></span><button type="button" class="x" id="chX" aria-label="關閉對話">✕</button></div>
    <div class="tsel"><select id="chSel" aria-label="選擇任務"></select><button type="button" class="go" id="chCan" hidden>取消</button></div>
    <div id="msgs" role="log" aria-live="polite" tabindex="0"></div>
    <form class="cf" id="chF" autocomplete="off"><input id="chI" type="text" maxlength="4000" aria-label="追加任務給這隻貓" placeholder="接著交代這隻貓…"><button type="submit" class="go" id="chGo">送出</button></form>
  </section>
</div>
<aside id="panel" aria-label="貓咪名單">
  <div class="ph"><h2>貓咪名單</h2><span id="cnt"></span></div>
  <p class="pt">點一下移到那隻貓</p>
  <form id="sendF" class="send" autocomplete="off">
    <input id="sendT" type="text" maxlength="4000" placeholder="📮 交給貓咪:例如今天 AI 新聞" aria-label="任務內容">
    <div class="sr"><select id="sendB" aria-label="指派給"><option value="">🧭 自動分派</option></select><button type="submit" id="sendGo" class="go">發任務</button></div>
    <p id="sendM" class="sm" role="status"></p>
  </form>
  <ul id="roster" aria-label="貓咪狀態清單"><li class="empty">等待資料…</li></ul>
  <p class="credit">貓咪、家具與房間皆為原創向量繪製(程式內路徑繪製,不使用外部圖檔)。</p>
</aside>
<script>
"use strict";
if(new URLSearchParams(location.search).has("sheet")||new URLSearchParams(location.search).has("coats")||new URLSearchParams(location.search).has("plants")||new URLSearchParams(location.search).has("sleep")||new URLSearchParams(location.search).has("anim"))document.body.classList.add("sheet");
const Q=new URLSearchParams(location.search);
const SPEED=parseFloat(Q.get("speed"))||1, T0=parseFloat(Q.get("t0"))||0;
const REDUCED=Q.has("reduced")||matchMedia("(prefers-reduced-motion: reduce)").matches;
const CAT_DEFAULT=0.66;
const W=1220,H=866,TAU=Math.PI*2;
/* 全域貓咪縮放:所有姿勢/步態/粒子/點擊區/標籤偏移都乘它;?catscale=0.65 可即時調整 */
const CAT_SCALE=(()=>{const v=parseFloat(new URLSearchParams(location.search).get("catscale"));return v>=.3&&v<=1.5?v:CAT_DEFAULT})();
const CS=CAT_SCALE;
const cv=document.getElementById("cv"),MAINCTX=cv.getContext("2d");let g=MAINCTX;
const stage=document.getElementById("stage"),tip=document.getElementById("tip");
const rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.random()*a.length|0];
/* ================= 毛色(v6:每種毛色有自己的柔和輪廓色) ================= */
const OUT="#6e4b3d",OW=2.0,LN="#8a5f4d",IW=1.15; // IW=內部線(約外輪廓 60%)
const COATS={
 ginger:{type:"tabby",base:"#f8c48e",dark:"#ecab70",belly:"#fff0dc",sh:"#ecab70",ui:"#f2a65a",line:"#d58450",ear:"#f7b3ab",str:"#e08c4c",str2:"#f0b27c",tuft:1},
 gray:{type:"solid",base:"#c9cfe0",dark:"#b3bad2",belly:"#f1f2f9",sh:"#b3bad2",ui:"#a9b0cc",line:"#9a98b8",ear:"#f6bcc4"},
 tux:{type:"tux",base:"#8d83a6",dark:"#7b7195",white:"#fffaf2",sh:"#7b7195",ui:"#766b8e",line:"#6c5a80",ear:"#f5b6c0",tuft:1},
 calico:{type:"calico",base:"#fff6ea",o:"#f7b676",d:"#a28b7e",sh:"#efe0cc",ui:"#f4a862",line:"#b98c72",ear:"#f7b9b5"},
 siamese:{type:"siamese",base:"#fdf1de",pt:"#9b7761",belly:"#fff7e9",sh:"#e8d6bd",ui:"#8d6c5a",line:"#8a6a56",lt:"#70523f",ear:"#e9b0a8"},
 cocoa:{type:"tabby",base:"#d9b08a",dark:"#c79d76",belly:"#f6e6d2",sh:"#c79d76",ui:"#b98b66",line:"#ad7f58",str:"#b0805a",str2:"#c9a27c",ear:"#f4b8b6"},
 // ---- v7 新增花色(sty: mack 鯖魚紋 / class 經典漩渦 / spot 玫瑰斑;pat=固定色塊;sock=白手套;bib=白胸;tailc/earc=尾/耳色)
 cream:{type:"tabby",base:"#fbe3bd",belly:"#fff6e6",sh:"#efd0a2",ui:"#e9c08a",line:"#d6a672",ear:"#f6bdb5",str:"#e5bd8a",str2:"#f2d4a8"},
 brown:{type:"tabby",sty:"class",base:"#b9824f",belly:"#e9d2b3",sh:"#a47a50",ui:"#946a42",line:"#7a5236",ear:"#e6aaa4",str:"#5d402b",str2:"#8a6644"},
 silver:{type:"tabby",base:"#d6d9de",belly:"#f6f7f9",sh:"#bcc0c8",ui:"#8f949e",line:"#7b808c",ear:"#f3bdc6",str:"#6a707b",str2:"#9ca2ad",tuft:1},
 mack:{type:"tabby",base:"#a99b83",belly:"#ddd3c1",sh:"#988a72",ui:"#7a6d58",line:"#6b5e4b",ear:"#e2aaa6",str:"#5b4f3f",str2:"#867863"},
 black:{type:"solid",dk:1,base:"#5a5463",belly:"#6a6473",sh:"#4a4453",ui:"#3e3846",line:"#2f2a36",ear:"#a4788a"},
 white:{type:"solid",base:"#fffaf3",belly:"#fffdf9",sh:"#ecdfd0",ui:"#e0ccb6",line:"#cdb6a0",ear:"#f8c1c3"},

const SYNC={bots:0,sessions:0,events:0,reconnects:0};

const BOTCOAT={router:"ginger",assistant:"tux",news:"gray"};
const hash=x=>{let h=0;for(const ch of String(x))h=(h*31+ch.charCodeAt(0))>>>0;return h};
const TOOLKIND=t=>{
  if(/^(WebSearch|WebFetch)$/.test(t)||/search|fetch|browse/i.test(t))return"search";
  if(/^(Read|Grep|Glob|LS|NotebookRead)$/.test(t))return"read";
  if(/^(Edit|Write|MultiEdit|NotebookEdit)$/.test(t))return"write";
  return"type";   // Bash 與其他工具:敲鍵盤
};

  const t=Date.now()+ms;if(reeval&&reevalAt<=t)return;
  clearTimeout(reeval);reevalAt=t;reeval=setTimeout(()=>{reeval=0;reevalAt=0;applyAll()},ms)}
function botMode(b){
  if(cancelUntil[b.id]>Date.now()){later(cancelUntil[b.id]-Date.now()+50);return["idle",{}]}
  if(b.status==="rotating")return["rotate",{}];
  if(b.status==="error")return["error",{}];
  if(b.status==="working"){const m=/^🔧\s*([^:\s]+)/.exec(b.action||"");return["work",{tool:TOOLKIND(m?m[1]:"")}]}
  if(b.status==="thinking")return["think",{}];
  if(b.status==="done"){
    const k=b.id+"|"+b.task_id;
    if(seenDone[b.id]!==k){seenDone[b.id]=k;doneAt[b.id]=firstLoad?0:Date.now()}
    const left=10000-(Date.now()-(doneAt[b.id]||0));
    if(left>0){later(left+200);return["done",{t:b.task_id}]}
  }
  if(b.queued>0)return["wait",{n:Number(b.queued)}];

  if(m[0]==="idle"&&c.mode==="idle")return;

const MAXC=24;

  const want=new Map();   // id -> {def, mode, detail, extra}

    want.set("b:"+b.id,{id:b.id,def:{id:b.id,name:(b.emoji?b.emoji+" ":"")+b.name.replace(/\s*Bot$/,""),coat:BOTCOAT[b.id]||COATKEYS[hash(b.id)%COATKEYS.length],kind:"bot"},m,
      detail:cancelUntil[b.id]>Date.now()?"任務已取消":(m[0]==="work"||m[0]==="think"||m[0]==="error"||m[0]==="done")?act:"",
      extra:(b.queued>0?"佇列 "+Number(b.queued)+" 件・":"")+"今日 "+Number(b.tasks_today||0)+" 件"});
  }

    const tot=Object.keys(n).reduce((a,k)=>a+(byId[k]?n[k]:0),0);
    document.title=(tot?"("+tot+") ":"")+BASE_TITLE;
    for(const id in rbtn){const b=rbtn[id].querySelector(".ubr"),k=n[id]||0;if(b){b.hidden=!k;b.textContent=k?"💬 "+k:"";b.title=k?k+" 則未讀":""}}
    for(const id in UB)if(!n[id]||!byId[id]){UB[id].remove();delete UB[id]}
    for(const id in n){if(!byId[id])continue;let e=UB[id];if(!e){e=UB[id]=document.createElement("div");e.className="ub";stage.appendChild(e)}
      e.textContent="💬 "+n[id];e.title=n[id]+" 則未讀"}
    dirty=true;
  }
  function viewMark(){ // 對話面板正顯示的任務若已完成且分頁可見 → 標已讀
    const c=cur;if(!c||!c.tid||document.hidden)return;
    const t=TL.find(x=>x.id===c.tid)||c.tasks.find(x=>x.id===c.tid);if(!t||!isUnread(t))return;
    US.read.push(t.id);usSave();paintUnread();
  }
  async function refreshUnread(){
    if(DEMO)return;const n=++unN;let rows;
    try{rows=await api("/api/tasks?limit=100")}catch(_){return}
    if(n!==unN||!Array.isArray(rows))return;
    TL=rows;
    if(US.hw==null){US.hw=rows.reduce((m,t)=>Math.max(m,t.finished||0),0);usSave()}   // 第一次載入:歷史任務不算未讀
    paintUnread();viewMark();
  }
  const schedUnread=()=>{clearTimeout(unT);unT=setTimeout(refreshUnread,300)};
  document.addEventListener("visibilitychange",viewMark);
  function sync(){ // 依最新 Bot 清單更新指派下拉與對話標頭
    const ss=bots.map(b=>b.id+":"+b.status+":"+b.task_id).join();if(ss!==stSig){stSig=ss;schedUnread()}   // 有任務狀態轉換 → 重算未讀
    paintUnread();
    const rb=bots.filter(b=>!b.is_router),s=rb.map(b=>b.id+"|"+nm(b)).join(",");
    if(s!==sig){sig=s;const v=selB.value;selB.textContent="";
      const o0=document.createElement("option");o0.value="";o0.textContent="🧭 自動分派";selB.appendChild(o0);
      rb.forEach(b=>{const o=document.createElement("option");o.value=b.id;o.textContent=nm(b);selB.appendChild(o)});
      if(rb.some(b=>b.id===v))selB.value=v}
    if(cur)renderHeader();
  }
  function renderHeader(){
    const b=botOf(cur.bot);if(!b)return;
    chT.textContent=nm(b)+(b.is_router?"・分派紀錄":"");
    const m=({thinking:"think",working:"work",error:"error"})[b.status]||"";
    chS.textContent=(BLAB[b.status]||b.status)+(b.queued>0?"・佇列 "+Number(b.queued):"");chS.className="chip "+m;
    $("chF").style.display=b.is_router?"none":"";
  }
  /* ----- 發任務(全域) ----- */
  async function submit(text,bot,btn){
    btn.disabled=true;
    try{return await api("/api/tasks",{text,bot:bot||null})}
    finally{btn.disabled=false}
  }
  $("sendF").addEventListener("submit",async e=>{
    e.preventDefault();const text=inT.value.trim();if(!text){note("先寫任務內容",true);return}
    if(DEMO){note("示範模式不會送出任務",true);return}
    note(selB.value?"投遞中…":"幕僚長分派中…");
    try{
      const t=await submit(text,selB.value,$("sendGo"));inT.value="";
      const b=botOf(t.bot);
      if(t.status==="unassigned")note("幕僚長找不到合適的貓:"+clip(t.route_reason,40),true);
      else{note("已交給 "+(b?nm(b):t.bot)+"(任務 #"+Number(t.id)+")");if(b&&byId[b.id]&&!b.is_router)select(b.id,true)}
    }catch(err){note("送出失敗:"+err.message,true)}
  });
  /* ----- 對話檢視 ----- */
  function select_(id){ // 由 select() 呼叫:Bot 貓 → 開對話;其他(session / 取消選取)→ 關
    const b=id&&botOf(id);
    if(!b){close();return}
    if(cur&&cur.bot===id)return;
    cur={bot:id,tasks:[],tid:null,follow:true,evs:new Map(),seq:0};
    chat.hidden=false;document.body.classList.add("chatopen");renderHeader();box.textContent="";
    loadTasks();
  }
  function close(){cur=null;chat.hidden=true;document.body.classList.remove("chatopen")}
  $("chX").onclick=()=>select(null,false);
  chat.addEventListener("wheel",e=>e.stopPropagation(),{passive:true});   // 別讓房間的滾輪縮放吃掉
  chat.addEventListener("keydown",e=>{if(e.key==="Escape"){e.stopPropagation();select(null,false)}});
  async function loadTasks(){
    const c=cur;if(!c)return;const n=++c.seq;
    let rows;try{rows=await api("/api/tasks?bot="+encodeURIComponent(c.bot)+"&limit=20")}catch(err){if(cur===c&&n===c.seq)msg("讀取任務失敗:"+err.message,"e");return}
    if(cur!==c||n!==c.seq||!Array.isArray(rows))return;
    c.tasks=rows;
    if(c.follow||!rows.some(t=>t.id===c.tid)){const nt=rows.length?rows[0].id:null;if(nt!==c.tid){c.tid=nt;c.evs=new Map();c.follow=true;await loadEvents();return}}
    drawSel();draw();
  }
  async function loadEvents(){
    const c=cur,tid=c&&c.tid;drawSel();if(!tid){draw();return}
    try{const rows=await api("/api/tasks/"+tid+"/events");
      if(cur!==c||c.tid!==tid)return;
      rows.forEach(r=>c.evs.set(r.id,r));
    }catch(err){if(cur===c)msg("讀取對話失敗:"+err.message,"e");return}
    draw(true);
  }
  function msg(t,k){box.textContent="";const d=document.createElement("div");d.className="m "+k;d.textContent=t;box.appendChild(d)}
  function drawSel(){
    const c=cur;if(!c)return;tsel.textContent="";
    if(!c.tasks.length){const o=document.createElement("option");o.textContent="(還沒有任務)";tsel.appendChild(o);tsel.disabled=true;chCan.hidden=true;return}
    tsel.disabled=false;
    c.tasks.forEach(t=>{const o=document.createElement("option");o.value=t.id;o.textContent="#"+t.id+" "+(ICON[t.status]||"•")+" "+clip(String(t.text||"").replace(/\s+/g," "),30);tsel.appendChild(o)});
    tsel.value=String(c.tid);
    const t=c.tasks.find(x=>x.id===c.tid);chCan.hidden=!(t&&(t.status==="queued"||t.status==="running"));
  }
  tsel.onchange=()=>{const c=cur;if(!c)return;c.tid=Number(tsel.value);c.follow=c.tasks.length>0&&c.tid===c.tasks[0].id;c.evs=new Map();box.textContent="";loadEvents()};
  chCan.onclick=async()=>{const c=cur;if(!c||!c.tid)return;chCan.disabled=true;
    try{await api("/api/tasks/"+c.tid+"/cancel",{})}catch(err){msg("取消失敗:"+err.message,"e")}
    chCan.disabled=false;sched()};
  $("chF").addEventListener("submit",async e=>{
    e.preventDefault();const c=cur,text=chI.value.trim();if(!c||!text)return;
    try{await submit(text,c.bot,$("chGo"));chI.value="";c.follow=true;await loadTasks()}
    catch(err){const d=document.createElement("div");d.className="m e";d.textContent="送出失敗:"+err.message;box.appendChild(d);box.scrollTop=box.scrollHeight}
  });
  const fmtT=ts=>ts?new Date(ts*1000).toLocaleTimeString("zh-TW",{hour12:false}):"";
  const nf=n=>Number(n||0).toLocaleString("en-US");
  function el(cls,txt,tag){const d=document.createElement(tag||"div");d.className=cls;if(txt!=null)d.textContent=txt;return d}
  function draw(toEnd){
    const c=cur;if(!c)return;const t=c.tasks.find(x=>x.id===c.tid);
    if(!t){msg(c.tasks.length?"找不到這個任務,請從上面重新選擇。":"這隻貓還沒有任務。在下面交代一件事吧。","b");return}
    const stick=toEnd||box.scrollHeight-box.scrollTop-box.clientHeight<48;
    const f=document.createDocumentFragment();
    const u=el("m u");u.appendChild(el("","#"+t.id+"・"+fmtT(t.created),"small"));u.appendChild(document.createTextNode(String(t.text||"")));f.appendChild(u);
    if(t.route_reason&&t.route_by==="router")f.appendChild(el("note","🧭 幕僚長分派:"+t.route_reason));
    const evs=[...c.evs.values()].sort((a,b)=>a.id-b.id);let lastText=null,res=null;
    evs.forEach(ev=>{const d=ev.data||{};
      if(ev.kind==="text"){lastText=String(d.text||"");f.appendChild(el("m b",lastText))}
      else if(ev.kind==="tool_use")f.appendChild(el("tc","🔧 "+clip(d.tool,40)+(d.summary?": "+clip(d.summary,200):"")));
      else if(ev.kind==="tool_result")f.appendChild(el("tc rs"+(d.ok===false?" bad":""),(d.ok===false?"✗ ":"↩ ")+clip(String(d.preview||"").replace(/\s+/g," "),160)));
      else if(ev.kind==="result")res=d;
      else if(ev.kind==="error")f.appendChild(el("m e","⚠️ "+clip(d.message,500)));
      else if(ev.kind==="cancelled")f.appendChild(el("note","⛔ 已取消"));
      else if(ev.kind==="rotated")f.appendChild(el("note","⟳ 換新對話("+clip(d.reason,60)+")"));
      else if(ev.kind==="rotate_failed")f.appendChild(el("note","⟳ 收尾失敗:"+clip(d.note||d.reason,80)));
      else if(ev.kind==="task_started"&&d.resumed)f.appendChild(el("note","(接續先前的對話)"));
    });
    if(res&&String(res.text||"").trim()&&String(res.text).trim()!==(lastText||"").trim())f.appendChild(el("m r",String(res.text)));
    const bits=[ICON[t.status]||"",t.status];
    if(t.status==="done"||t.status==="error"){
      const us=res&&res.usage||{};
      bits.push("輸入 "+nf((t.input_tokens||us.input_tokens||0)+(t.cache_create||0))+"・快取讀 "+nf(t.cache_read)+"・輸出 "+nf(t.output_tokens||us.output_tokens)+" tokens");
      const dur=t.duration_ms||(res&&res.duration_ms);if(dur)bits.push((dur/1000).toFixed(1)+" 秒");
      const usd=t.cost_usd||(res&&res.cost_usd);if(usd)bits.push("約 $"+Number(usd).toFixed(4));
    }
    f.appendChild(el("stat",bits.filter(Boolean).join("・")));
    if(t.status==="queued"||t.status==="running"||t.status==="routing")f.appendChild(el("dots","貓咪處理中"));
    box.textContent="";box.appendChild(f);
    if(stick)box.scrollTop=box.scrollHeight;
    viewMark();
  }
  function sched(){clearTimeout(tmr);tmr=setTimeout(loadTasks,250)}   // 任務狀態有變:稍後重抓清單(合併連發事件)
  function ev(e){
    if(e&&(e.kind==="result"||e.kind==="error"))schedUnread();
    const c=cur;if(!c||!e)return;
    if(e.bot===c.bot||c.bot==="router"||e.task_id===c.tid){
      if(e.task_id===c.tid&&e.id!=null){c.evs.set(e.id,e);if(!rafD)rafD=requestAnimationFrame(()=>{rafD=0;draw()})}
      if(e.kind!=="text"&&e.kind!=="tool_use"&&e.kind!=="tool_result")sched();
    }
  }
  function reload(){refreshUnread();if(cur)loadTasks().then(()=>{if(cur&&cur.tid)loadEvents()})}
  window.ROOM&&(ROOM.unread=()=>({hw:US.hw,read:US.read.slice(),unr:Object.assign({},UNR),title:document.title}));
  return {sync,select:select_,event:ev,reload};
})();
let rszQ=0;const rszGo=()=>{if(rszQ)return;rszQ=requestAnimationFrame(()=>{rszQ=0;resize()})};
if(window.ResizeObserver)new ResizeObserver(rszGo).observe(stage);else addEventListener("resize",rszGo);
start();
</script>
</body>
</html>
